name: Supabase Keep Alive

on:
  schedule:
    # Run at 00:00 UTC on Tuesday and Friday
    - cron: "0 0 * * 2,5"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL || 'https://eppcuwkvffkixfvxfrtn.supabase.co' }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_i0YhVg2L6H0by7MIMcyzPg_7pAarfm7' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_i0YhVg2L6H0by7MIMcyzPg_7pAarfm7' }}"
